version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./sql_app.db
      - SECRET_KEY=ai_lost_and_found_secret_jwt_key_2026_super_secure
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/sql_app.db:/app/sql_app.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
